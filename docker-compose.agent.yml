services:
  alloy:
    image: grafana/alloy:v1.0.0
    container_name: alloy-agent
    ports:
      - "12345:12345" # Ekspos port agar bisa di-scrape
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      OTEL_GATEWAY_ENDPOINT: ${OTEL_GATEWAY_ENDPOINT:?Set OTEL_GATEWAY_ENDPOINT to the central Alloy host and port}
    volumes:
      - ./alloy/agent.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    restart: unless-stopped
volumes:
  alloy_data:
  
